name: Shared platform qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run complete qualification and retain its exit status
        id: gate
        shell: bash
        run: |
          # Regular-file capture preserves large failure output before the shell exits.
          set +e
          bun run validate > "$RUNNER_TEMP/region-intel-qualification.log" 2>&1
          gate_status=$?
          set -e
          cat "$RUNNER_TEMP/region-intel-qualification.log"
          exit "$gate_status"
      - name: Retain complete qualification diagnostics
        if: always() && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact@v7.0.2
        with:
          name: qualification-${{ github.sha }}
          path: ${{ runner.temp }}/region-intel-qualification.log
          if-no-files-found: error
          retention-days: 7
